[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-memory"
dynamic = ["version"]
description = "A local-first persistent memory substrate for language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Continuum Memory contributors"}]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66", "pydantic>=2.8"]
plugin = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "pydantic>=2.8", "mcp>=2.0,<3"]

[project.scripts]
continuum-memory = "continuum_memory.cli:main"
continuum-memory-mcp = "continuum_memory.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "continuum_memory.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
