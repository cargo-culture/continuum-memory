[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-memory"
version = "0.3.0"
description = "A local-first persistent memory substrate for language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Continuum Memory contributors"}]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66", "pydantic>=2.8"]
dev = ["pytest>=8.0", "pydantic>=2.8"]

[project.scripts]
continuum-memory = "continuum_memory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
